name: Web

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'vercel'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./www
        run: bun install --frozen-lockfile

      - name: Build WASM
        run: |
          wasm-pack build crates/val-wasm --target web \
            --out-name val \
            --out-dir ../../www/packages/val-wasm

      - name: Test
        working-directory: ./www
        run: bun test --pass-with-no-tests

      - name: Build
        working-directory: ./www
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: './www/dist'
          if-no-files-found: error

  deploy:
    environment:
      name: production
      url: ${{ steps.deployment.outputs.url }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: .vercel/output/static

      - name: Prepare deployment
        run: printf '{"version":3}\n' > .vercel/output/config.json

      - name: Deploy to Vercel
        id: deployment
        run: |
          url=$(bunx vercel@63.1.2 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
