name: Web

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./www
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: ./www
        run: bun run lint

      - name: Test
        working-directory: ./www
        run: bun test --pass-with-no-tests

      - name: Build
        working-directory: ./www
        run: bun run build
