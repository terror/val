name: Web

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install --yes emscripten

      - name: Build WASM
        run: |
          wasm-pack build crates/val-wasm --target web \
            --out-name val \
            --out-dir ../../www/packages/val-wasm \
            --locked

      - name: Check generated types
        run: git diff --exit-code -- www/packages/val-wasm/val.d.ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./www
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: ./www
        run: bun run lint

      - name: Test
        working-directory: ./www
        run: bun test --pass-with-no-tests

      - name: Build
        working-directory: ./www
        run: bun run build
