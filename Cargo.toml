[package]
name = "val"
version = "0.8.0"
edition = "2024"
authors = ["Liam <liam@scalzulli.com>"]
description = "An arbitrary precision calculator language"
license = "CC0-1.0"
repository = "https://github.com/terror/val"
categories = ["science", "parser-implementations", "command-line-interface"]
keywords = ["productivity", "compilers"]
include = ["/CHANGELOG.md", "/LICENSE", "/README.md", "/benches", "/src", "/tests"]

[[bin]]
name = "val"
required-features = ["cli"]

[[bench]]
name = "main"
harness = false

[[test]]
name = "integration"
required-features = ["cli"]

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1

[workspace]
members = [".", "crates/val-changelog", "crates/val-wasm-libc-shim"]
resolver = "2"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
arbitrary_source_item_ordering = "deny"
pedantic = { level = "deny", priority = -1 }
wildcard_imports = "allow"

[workspace.lints.rust]
unreachable_pub = "deny"

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "dep:dirs", "dep:rustyline"]
force-cross = ["dep:gmp-mpfr-sys", "gmp-mpfr-sys/force-cross"]
use-system-libs = ["dep:gmp-mpfr-sys", "gmp-mpfr-sys/use-system-libs"]

[dependencies]
anyhow = { version = "1.0.102", optional = true }
ariadne = { version = "0.6.0", features = ["auto-color"] }
chumsky = { version = "0.14.1", features = ["pratt"] }
clap = { version = "4.5.60", features = ["derive"], optional = true }
dirs = { version = "7.0.0", optional = true }
gc = "0.5.1"
gmp-mpfr-sys = { version = "~1.7", default-features = false, optional = true }
inventory = "0.3.24"
rug = { version = "1.30.0", default-features = false, features = ["float", "rational", "std"] }
rustyline = { version = "19.0.0", optional = true }
stacker = "0.1.22"
thiserror = "2.0.19"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
executable-path = "1.0.1"
indoc = "2.0.7"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
unindent = "0.2.4"
